<div class="card project">
  {% if include.project.image %}
    <img src="{{ include.project.image }}" alt="{{ include.project.name }}" class="project-image">
  {% endif %}
  <h3>{{ include.project.name }}</h3>
  <p>{{ include.project.description }}</p>
  {% if include.project.link %}
  <a href="{{ include.project.link }}" class="btn-sm">View</a>
  {% endif %}
</div>
